<section class="download">
  <div class="download__container">
    <h2 class="download__title">{{ 'download.title' | translate }}</h2>
    <p class="download__description">
      {{ 'download.description' | translate }}
    </p>
    <div class="download__stores">
      <a href="#" class="download__store-link">
        <img
          ngSrc="assets/img/login/stores/apple_app_store.png"
          alt="Download on the App Store"
          width="180"
          height="60"
        />
      </a>
      <a href="#" class="download__store-link">
        <img
          ngSrc="assets/img/login/stores/google_play_store.png"
          alt="Get it on Google Play"
          width="180"
          height="60"
        />
      </a>
    </div>
  </div>
</section>
